<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>hideliv — знак: коробка с лупой</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@600&display=swap">
<style>
/* Знак по эскизу Вики: синий квадрат = коробка, вырезанная лупа внутри (негативное пространство) */
:root{--blue:#2446D9}
*{box-sizing:border-box}
body{margin:0;background:#E9EAEC;font-family:Onest,sans-serif}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px;width:1440px}
.card{background:#fff;border-radius:12px;overflow:hidden}
.cap{padding:12px 18px;font-size:14px;color:#6B7079}
.cap b{color:#151617;font-weight:600;margin-right:8px}
.pane{height:190px;display:flex;align-items:center;justify-content:center;gap:40px}
.pane.d{background:#0B0D12;color:#fff}
.pane.l{background:#F6F6F7;color:#151617}
.big{width:96px;height:96px}
.lock{display:inline-flex;align-items:center;gap:10px}
.lock svg{width:30px;height:30px}
.wm{font-weight:600;font-size:34px;letter-spacing:-.035em;line-height:1}
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
// Каждый знак — квадрат 24×24 с вырезом через mask: так «лупа» прозрачна и на любом фоне видна как дыра в коробке
const marks = {
  A: { name: 'Ромб-лупа', note: 'как эскиз 1: линза-ромб с окошком, ручка вниз-влево',
       cut: '<path d="M14 2.6 22.6 11.2 14 19.8 5.4 11.2Z"/><path d="M8.2 14.6 10.6 17 3.4 24.2 1 21.8Z"/>',
       keep: '<path d="M14 8.4 16.8 11.2 14 14 11.2 11.2Z"/>' },
  B: { name: 'Ромб-линза', note: 'как эскиз 2: сплошная линза-ромб, ручка-просвет',
       cut: '<path d="M14 1 23 10 14 19 7 12Z"/><path d="M7.6 14.4 10 16.8 2.4 24.4 0 22Z"/>', keep: '' },
  C: { name: 'Круглая линза', note: 'как эскиз 3: круг + ручка, самый «читаемый»',
       cut: '<circle cx="14.2" cy="9.8" r="7.6"/><path d="M7.6 14.2 10 16.6 2.2 24.4 -.2 22Z"/>', keep: '' },
  D: { name: 'Линза с бликом', note: 'C + маленький блик внутри линзы — живее в шапке',
       cut: '<circle cx="14.2" cy="9.8" r="7.6"/><path d="M7.6 14.2 10 16.6 2.2 24.4 -.2 22Z"/>',
       keep: '<path d="M10.4 9.4a3.8 3.8 0 0 1 3.4-3.4v1.8a2 2 0 0 0-1.6 1.6Z"/>' },
  E: { name: 'Коробка со скосом', note: 'C, но у квадрата скруглены углы r=3 — мягче, как иконка приложения',
       cut: '<circle cx="14.2" cy="9.8" r="7.6"/><path d="M7.6 14.2 10 16.6 2.2 24.4 -.2 22Z"/>', keep: '', r: 3 },
  F: { name: 'Ромб с галочкой', note: 'A, но вместо окошка — галочка «проверено»',
       cut: '<path d="M14 2.6 22.6 11.2 14 19.8 5.4 11.2Z"/><path d="M8.2 14.6 10.6 17 3.4 24.2 1 21.8Z"/>',
       keep: '<path d="M10.6 11.2l2.4 2.4 4.4-4.4-1.2-1.2-3.2 3.2-1.2-1.2Z"/>' },
};
const svg = (k, fill, id) => {
  const m = marks[k];
  return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><defs><mask id="${id}"><rect width="24" height="24" fill="#fff"/><g fill="#000">${m.cut}</g><g fill="#fff">${m.keep}</g></mask></defs><rect width="24" height="24" rx="${m.r || 0}" fill="${fill}" mask="url(#${id})"/></svg>`;
};
let n = 0;
document.getElementById('g').innerHTML = Object.keys(marks).map(k => {
  const m = marks[k];
  const pane = (cls, wm) => `<div class="pane ${cls}"><span class="big">${svg(k, '#2446D9', 'm' + n++)}</span><span class="lock">${svg(k, '#2446D9', 'm' + n++)}<span class="wm">hideliv</span></span></div>`;
  return `<section class="card"><div class="cap"><b>${k} · ${m.name}</b>${m.note}</div>${pane('d')}${pane('l')}</section>`;
}).join('');
</script>
</body>
</html>
